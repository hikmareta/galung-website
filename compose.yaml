services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: galung
      POSTGRES_USER: galung
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galung -d galung"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
